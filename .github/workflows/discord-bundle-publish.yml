name: Discord Bundle Publisher

on:
  release:
    types: [published]

jobs:
  discord-share:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download .exe from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching release asset URL..."
          # Uses the GitHub CLI to download all assets (or specific .exe) from the triggering release
          gh release download ${{ github.event.release.tag_name }} --pattern "*.exe" --dir ./dist
          
          # Verify the file exists
          if [ ! -d "./dist" ] || [ -z "$(ls -A ./dist)" ]; then
            echo "Error: No .exe asset found in the release."
            exit 1
          fi

      - name: Materialize License Key
        env:
          LICENSE_KEY_DATA: ${{ secrets.LICENSE_KEY }}
        run: |
          # Create the bundle staging area
          mkdir -p ./bundle
          
          # Move the downloaded exe into the bundle folder
          mv ./dist/*.exe ./bundle/
          
          # Write the secret to license.key inside the bundle folder
          echo "$LICENSE_KEY_DATA" > ./bundle/license.key
          echo "Successfully materialized license.key."

      - name: Create Zip Archive
        run: |
          cd bundle
          zip -r ../app-with-license.zip ./*
          cd ..
          echo "Bundle zipped successfully."

      - name: Post Bundle to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Error: DISCORD_WEBHOOK secret is missing."
            exit 1
          fi
          
          # Construct a clean notification message
          MESSAGE="🚀 **New Release Bundle Available!**\n\n**Version:** \`${{ github.event.release.tag_name }}\`\n**Release Notes:** ${{ github.event.release.html_url }}\n\n*Download the attached ZIP file below for the fully authorized runnable bundle (includes executable and your personal license key).*"
          
          # Send the ZIP file to Discord using curl (multipart/form-data)
          curl -F "payload_json={\"content\": \"$MESSAGE\"}" \
               -F "file=@app-with-license.zip" \
               $DISCORD_WEBHOOK
