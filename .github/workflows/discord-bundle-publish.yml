env:
GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
run: |
         mkdir -p _release
         gh release download "${{ steps.rel.outputs.tag }}" \
           --repo "${{ github.repository }}" \
            --pattern "${{ steps.rel.outputs.zip_name }}" \
            --pattern "${{ steps.rel.outputs.exe_name }}" \
           --dir _release
          printf '%s' "$LICENSE_KEY" > _release/license.key
          exe_name="${{ steps.rel.outputs.exe_name }}"
          zip_name="${exe_name%.exe}.zip"
          (cd _release && zip "$zip_name" "$exe_name" license.key)
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

